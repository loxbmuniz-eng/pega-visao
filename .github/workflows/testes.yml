# =====================================================================
# TESTES DO SERVIDOR, A CADA PUSH
# ---------------------------------------------------------------------
# Até hoje a única coisa que rodava os 346 testes era eu, à mão, antes de
# publicar. Isso tem um limite óbvio: se alguém mais mexer no código — e a
# partir de agora vai ter parceiro de TI no repositório —, ninguém sabe se
# quebrou até alguém lembrar de rodar.
#
# Aqui roda sozinho: sobe um PostgreSQL descartável, aplica as 37 migrações
# e roda a bateria da API. Se ficar vermelho, aparece na hora no commit e no
# pull request, com o log.
#
# O QUE NÃO RODA AQUI, de propósito: a bateria de 110 telas (Playwright).
# Ela leva ~20 minutos e precisa de navegador — é cara para rodar a cada
# push. Ela continua obrigatória no portão de publicação (publicar.sh), que
# é onde ela protege o que interessa: o que vai para a operação.
# =====================================================================
name: Testes do servidor

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  api:
    name: Bateria da API (${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 24 é para onde o VPS vai (01/10/2026); 22 é o que roda nele até o
        # próximo atualizar, e o mínimo aceito. Testar os dois evita descobrir
        # em produção que alguém usou algo que uma das versões não entende.
        node: ['22', '24']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: suinco
          POSTGRES_PASSWORD: senha-de-teste-ci
          POSTGRES_DB: embarque_suinco
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U suinco -d embarque_suinco"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: '3010'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: embarque_suinco
      PGUSER: suinco
      PGPASSWORD: senha-de-teste-ci
      JWT_SECRET: segredo-so-do-ci-nao-vale-em-lugar-nenhum-32c
      JWT_VALIDADE: 12h
      ORIGENS_PERMITIDAS: https://embarquesuinco.com.br,https://www.embarquesuinco.com.br
      RATE_LIMIT: '300'
      RATE_LIMIT_LOGIN: '30'
      # Os dois abaixo faltavam e derrubavam 13 testes (BI respondendo 503
      # "não configurado"; fechamento recusando "senha não configurada").
      # São valores DE TESTE, como o JWT_SECRET acima: o token é o mesmo que
      # o api.test.js usa, e nenhum dos dois vale em lugar nenhum de verdade.
      BI_TOKEN: token-de-teste-do-bi
      SENHA_FECHAMENTO: senha-de-fechamento-so-do-ci

    defaults:
      run:
        working-directory: entregaveis/suinco_logistica/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: entregaveis/suinco_logistica/backend/package-lock.json

      # `npm ci` e não `npm install`: o lock manda. Instalação que resolve
      # versão sozinha testa um conjunto de dependências que não é o que vai
      # para o servidor.
      - name: Instalar dependências
        run: npm ci

      - name: Aplicar as migrações
        run: npm run migrar

      # A BATERIA NUNCA PASSOU AQUI até 02/10/2026 — 412 rodadas vermelhas
      # desde 26/08, e ninguém viu, porque o portão (publicar.sh) roda num
      # banco que JÁ TEM rotas e frota. Num banco recém-migrado, a carga de
      # teste na rota 500 batia na chave estrangeira de dim_rotas (46 falhas,
      # 141 canceladas). O servidor de verdade carrega esses dados no
      # instalar.sh com o seed.js; aqui faz o mesmo, pelo mesmo script.
      - name: Carregar rotas e frota (o mesmo seed do instalar.sh)
        run: node scripts/seed.js

      # Os 6 testes de PDF precisam de um Chromium — no servidor ele vem
      # pelo PLAYWRIGHT_CHROMIUM_PATH; aqui, o do próprio Playwright.
      - name: Instalar o Chromium dos relatórios em PDF
        run: npx playwright install --with-deps chromium

      - name: Rodar a bateria da API
        run: npm run teste

  seguranca:
    name: Vulnerabilidades nas dependências
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: entregaveis/suinco_logistica/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      # Só ALTA e CRÍTICA reprovam. Vulnerabilidade baixa em dependência de
      # desenvolvimento não pode travar uma correção de pátio às 6 da manhã.
      - name: npm audit
        run: npm audit --audit-level=high
