<!doctype html>
<meta charset="utf-8">
<title>Cena — demonstração de produto 16:9</title>
<link rel="stylesheet" href="../base.css">
<style>
  .palco { display: flex; flex-direction: column; padding: 74px 96px; gap: 34px; }
  .cabeca { display: flex; align-items: baseline; gap: 22px; }
  h1 { font-size: 52px; font-weight: 800; letter-spacing: -.03em; }
  .tag { font-size: 19px; color: var(--realce); border: 1px solid var(--realce);
         border-radius: 999px; padding: 7px 17px; font-weight: 700; }
  .terminal { flex: 1; background: #08080A; border: 1px solid var(--linha); border-radius: 14px;
              padding: 34px 38px; font-family: var(--mono); font-size: 25px; line-height: 1.75;
              overflow: hidden; box-shadow: inset 0 0 90px rgba(0,0,0,.6); }
  .prompt { color: var(--realce); }
  .cursor { display: inline-block; width: 13px; height: 26px; background: var(--realce);
            vertical-align: -4px; margin-left: 3px; }
  .resposta { color: var(--suave); white-space: pre-wrap; }
  .ok { color: var(--verde); }
  .passos { display: flex; gap: 16px; }
  .passo { flex: 1; border: 1px solid var(--linha); border-radius: 12px; padding: 20px 22px;
           font-size: 21px; color: var(--suave); }
  .passo b { display: block; color: var(--papel); font-size: 24px; margin-bottom: 5px; }
  .passo.ativo { border-color: var(--realce); color: var(--papel); }
</style>

<div class="palco">
  <div class="cabeca"><h1 id="titulo"></h1><span class="tag" id="tag"></span></div>
  <div class="terminal">
    <div><span class="prompt">$</span> <span id="comando"></span><i class="cursor" id="cursor"></i></div>
    <div class="resposta" id="resposta"></div>
    <div class="ok" id="final"></div>
  </div>
  <div class="passos" id="passos"></div>
  <div class="vinheta"></div>
</div>

<script src="../kit.js"></script>
<script>
(() => {
  const K = Kit;
  K.$('#titulo').textContent = K.dado('titulo', 'Como funciona');
  K.$('#tag').textContent = K.dado('tag', 'demonstração');
  const comando = K.dado('comando', 'estudio lote social clientes.csv');
  const saidas = K.lista('saidas', [
    'lendo clientes.csv .......... 312 linhas',
    'renderizando 1080x1920 @30fps',
    'ok  001/312  padaria_do_ze -> padaria_do_ze.mp4',
    'ok  002/312  otica_visao   -> otica_visao.mp4',
  ]);
  const final = K.dado('final', '312 vídeos prontos em 6 min 40 s.');

  const passos = K.lista('passos', [
    'Escreva :: a cena em HTML',
    'Aponte :: a planilha',
    'Receba :: um vídeo por linha',
  ]);
  const alvoP = K.$('#passos');
  const cartoes = passos.map((p) => {
    const [titulo, texto] = K.partes(p);
    const d = document.createElement('div');
    d.className = 'passo';
    d.innerHTML = `<b>${titulo ?? ''}</b>${texto ?? ''}`;
    d.style.opacity = '0';
    alvoP.appendChild(d);
    return d;
  });

  const T_COMANDO = 0.4;
  const dur = comando.length * 0.045;

  window.cena = {
    duracao: Number(K.dado('duracao', 12)), fps: 30, largura: 1920, altura: 1080,
    aoTempo(t) {
      K.surgir(K.$('.cabeca'), t, 0.10, 0.5, 22);
      K.surgir(K.$('.terminal'), t, 0.30, 0.6, 30);

      K.digitar(K.$('#comando'), comando, t, T_COMANDO, 0.045);
      // Cursor pisca a 2 Hz — calculado do t, nunca de setInterval: o quadro
      // precisa ser o mesmo em qualquer máquina.
      K.$('#cursor').style.opacity = t > T_COMANDO + dur ? (Math.floor(t * 2) % 2 ? '0' : '1') : '1';

      const inicio = T_COMANDO + dur + 0.35;
      const visiveis = Math.floor(K.limitar((t - inicio) / (saidas.length * 0.55)) * saidas.length);
      K.$('#resposta').textContent = saidas.slice(0, visiveis).join('\n');

      const tFinal = inicio + saidas.length * 0.55 + 0.3;
      K.$('#final').textContent = t >= tFinal ? final : '';
      cartoes.forEach((c, i) => {
        K.surgir(c, t, tFinal + 0.25 + i * 0.2, 0.5, 16);
        c.classList.toggle('ativo', t >= tFinal + 0.25 + i * 0.2);
      });
    },
  };
})();
</script>
