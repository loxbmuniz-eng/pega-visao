<!doctype html>
<meta charset="utf-8">
<title>Cena — anúncio 1:1</title>
<link rel="stylesheet" href="../base.css">
<style>
  .palco { display: flex; flex-direction: column; justify-content: space-between; padding: 84px; }
  .dor { font-size: 40px; color: var(--suave); line-height: 1.35; max-width: 18ch; }
  .dor s { color: #55555C; }
  h1 { font-size: 92px; line-height: 1.02; font-weight: 800; letter-spacing: -.035em; margin-top: 22px; }
  h1 em { font-style: normal; color: var(--realce); }
  .prova { display: flex; gap: 14px; margin-top: 34px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--linha); border-radius: 999px; padding: 13px 24px;
          font-size: 22px; color: var(--suave); }
  .oferta { border-top: 1px solid var(--linha); padding-top: 32px; display: flex;
            align-items: center; justify-content: space-between; gap: 24px; }
  .preco b { font-size: 62px; color: var(--realce); font-weight: 800; letter-spacing: -.03em; }
  .preco span { display: block; font-size: 21px; color: var(--suave); margin-top: 5px; }
  .botao { background: var(--realce); color: #0A0A0B; font-weight: 800; font-size: 27px;
           padding: 24px 44px; border-radius: 13px; white-space: nowrap; }
</style>

<div class="palco">
  <div>
    <p class="dor" id="dor"></p>
    <h1 id="titulo"></h1>
    <div class="prova" id="prova"></div>
  </div>
  <div class="oferta">
    <div class="preco"><b id="preco"></b><span id="condicao"></span></div>
    <div class="botao" id="cta"></div>
  </div>
  <div class="vinheta"></div>
</div>

<script src="../kit.js"></script>
<script>
(() => {
  const K = Kit;
  const antes = K.dado('antes', 'R$ 4.000/mês de editor de vídeo?');
  K.$('#dor').innerHTML = `<s>${antes}</s>`;
  const titulo = K.dado('titulo', 'Agora é um arquivo HTML.');
  const destaque = K.dado('destaque', 'HTML');
  K.$('#titulo').innerHTML = titulo.includes(destaque) ? titulo.replace(destaque, `<em>${destaque}</em>`) : titulo;
  K.$('#preco').textContent = K.dado('preco', 'R$ 0');
  K.$('#condicao').textContent = K.dado('condicao', 'código aberto, roda na sua máquina');
  K.$('#cta').textContent = K.dado('cta', 'Quero testar');

  const chips = K.lista('prova', ['sem assinatura', 'sem API paga', 'roda offline']);
  const alvo = K.$('#prova');
  const bolhas = chips.map((c) => {
    const d = document.createElement('div');
    d.className = 'chip'; d.textContent = c; d.style.opacity = '0';
    alvo.appendChild(d); return d;
  });

  window.cena = {
    duracao: Number(K.dado('duracao', 7)), fps: 30, largura: 1080, altura: 1080,
    aoTempo(t) {
      K.surgir(K.$('#dor'), t, 0.10, 0.5, 20);
      K.surgir(K.$('#titulo'), t, 0.45, 0.6, 40);
      bolhas.forEach((b, i) => K.surgir(b, t, 1.0 + i * 0.15, 0.45, 16));
      K.surgir(K.$('.oferta'), t, 1.7, 0.6, 24);
      // O botão pulsa devagar no fim: chamada para ação sem parecer banner.
      const p = K.limitar((t - 2.6) / 0.9);
      K.$('#cta').style.transform = `scale(${1 + 0.028 * Math.sin(t * 3.2) * p})`;
    },
  };
})();
</script>
